[project]
name = "devkit"
version = "0.3.0"
description = "Generate and validate new applications from versioned, configurable templates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "copier==9.19.1",
]

[project.scripts]
devkit = "devkit.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devkit"]

[tool.uv]
# Only resolve packages published before this date (rolling two-week supply-chain buffer).
# Raise it deliberately when upgrading dependencies.
exclude-newer = "2026-11-02T00:00:00Z"
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"
markers = [
  "integration: needs a web-core-template checkout (../web-core-template or $WEB_CORE_TEMPLATE)",
]
