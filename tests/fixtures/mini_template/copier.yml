# A tiny stand-in for a real template, used to test devkit's source handling without network.
# It honours the same contract as web-core-template: app_name, app_description, cache_components.
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml

app_name:
  type: str
  validator: >-
    {% if not (app_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits and hyphens.
    {% endif %}

app_description:
  type: str
  default: Mini default description

cache_components:
  type: bool
  default: true

zod:
  type: bool
  default: false

# The rule lives in the template, as in web-core-template: devkit never duplicates it.
forms:
  type: bool
  default: false
  validator: >-
    {% if forms and not zod %}forms requires zod: answer zod=true as well (forms is never enabled for you).{% endif %}

rest_api:
  type: bool
  default: false
  validator: >-
    {% if rest_api and not zod %}rest_api requires zod: answer zod=true as well (rest_api is never enabled for you).{% endif %}

database:
  type: str
  default: none
  choices: [none, postgres, supabase]
  validator: >-
    {% if database != 'none' and not zod %}database requires zod: answer zod=true as well (database is never enabled for you).{% endif %}

auth:
  type: bool
  default: false
  validator: >-
    {% if auth and not zod %}auth requires zod: answer zod=true as well (auth is never enabled for you).{% elif auth and not rest_api %}auth requires rest_api: answer rest_api=true as well (auth is never enabled for you).{% elif auth and database == 'none' %}auth requires a database: answer database=postgres or database=supabase as well (auth is never enabled for you).{% endif %}
